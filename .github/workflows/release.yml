name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, matching release.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: goat-voice-release
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      JOBS: 4
    steps:
      - name: Validate tag format
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source
        id: source
        run: |
          git merge-base --is-ancestor HEAD origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          python3 tools/release.py validate-tag "$RELEASE_TAG"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: swift-cache
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-xcode26.6-swiftbuild-${{ hashFiles('Package.swift', 'Package.resolved') }}
      - name: Prepare toolchain
        run: bash scripts/ci-setup.sh
      - name: Tests
        run: |
          python3 tools/collect-third-party-notices.py --check
          python3 -m unittest discover -s Tests -p 'test_*.py'
          bash scripts/test.sh
      - name: Build and verify
        run: |
          bash scripts/build-app.sh
          bash scripts/check-bundle.sh
          bash scripts/prepare-release.sh
      - name: Retain exact release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-bundle
          path: build/release/
          if-no-files-found: error
          retention-days: 14

      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-failure-diagnostics
          path: |
            build/test-results/
            ~/Library/Logs/DiagnosticReports/xctest*.ips
          if-no-files-found: ignore
          retention-days: 7

      - name: Save compiled dependencies
        if: ${{ !cancelled() && steps.swift-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .build
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}

  publish:
    name: Sign and publish
    needs: build
    runs-on: macos-26
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-bundle
          path: build/release
      - name: Sign archive and verify its public key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          chmod +x build/release/tools/sign_update build/release/tools/verify_update
          python3 tools/release.py sign build/release build/release/tools/sign_update build/release/tools/verify_update
      - name: Publish release, then update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish-release.py build/release
