name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Apple Silicon build and tests
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      JOBS: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Cache Swift build and dependencies
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: swift-cache
        with:
          path: .build
          key: ${{ runner.os }}-${{ runner.arch }}-xcode26.6-swiftbuild-${{ hashFiles('Package.swift', 'Package.resolved') }}
      - name: Prepare toolchain
        run: bash scripts/ci-setup.sh
      - name: Validate release configuration and tooling
        run: |
          python3 tools/release.py metadata
          python3 tools/collect-third-party-notices.py --check
          python3 -m unittest discover -s Tests -p 'test_*.py'
          bash -n scripts/*.sh
      - name: Swift tests
        run: |
          bash scripts/test.sh
      - name: Build application
        run: bash scripts/build-app.sh
      - name: Verify bundle and embedded XPC
        run: bash scripts/check-bundle.sh
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ci-failure-diagnostics
          path: |
            build/test-results/
            ~/Library/Logs/DiagnosticReports/xctest*.ips
          if-no-files-found: ignore
          retention-days: 7
      - name: Save compiled dependencies
        if: ${{ !cancelled() && steps.swift-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .build
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}
